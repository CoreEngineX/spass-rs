[workspace]
members = [
    "crates/spass-rs",
    "crates/spass-cli",
    "crates/spass-wasm",
    "crates/spass-uniffi",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
authors = ["CoreEngineX"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CoreEngineX/spass-rs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"

aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"

zeroize = { version = "1.7", features = ["derive"] }

clap = { version = "4.5", features = ["derive"] }

base64 = { version = "0.23.1", default-features = false, features = ["std"] }
hex = "0.4"
csv = "1.3"

uniffi = "0.32.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
