[workspace]
members = [
    "crates/spass-rs",
    "crates/spass-cli",
    "crates/spass-wasm",
    "crates/spass-uniffi",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
authors = ["CoreEngineX"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CoreEngineX/spass-rs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"

aes = { version = "0.9.3", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["zeroize"] }
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
hmac = "0.13.0"

zeroize = { version = "1.7", features = ["derive"] }

clap = { version = "4.5", features = ["derive"] }

base64 = { version = "0.23.1", default-features = false, features = ["std"] }
hex = "0.4"
csv = "1.3"

uniffi = "0.32.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
