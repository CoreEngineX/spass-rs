[package]
name = "spass-uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "spass_uniffi"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
spass = { path = "../spass-rs" }
uniffi = { workspace = true, features = ["cli"] }
thiserror = { workspace = true }

[dev-dependencies]
# `spass::testkit` generates .spass fixtures in-process for the integration tests. Test builds only.
spass = { path = "../spass-rs", features = ["generate-fixtures"] }
